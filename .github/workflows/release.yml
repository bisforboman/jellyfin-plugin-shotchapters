name: Release

# Push a tag vX.Y.Z on main once build.yaml's version is X.Y.Z.0 and the csproj's X.Y.Z, or run this workflow on main
# by hand (Actions -> Release -> Run workflow), which releases build.yaml's version and creates its tag: this tests, packages
# shot-chapters_X.Y.Z.0.zip and publishes a GitHub release with it and manifest.json (every version so far), the
# plugin repository users add in Jellyfin:
# https://github.com/bisforboman/jellyfin-plugin-shotchapters/releases/latest/download/manifest.json

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      DOTNET_NOLOGO: true
      FFMPEG_RELEASE: autobuild-2026-09-30-13-08
      FFMPEG_NAME: ffmpeg-n8.1.3-9-g29e619e767-linux64-gpl-8.1
      FFMPEG_SHA256: 97ce978979194b5cf7e06a5e68020dbdaa7a4f3294c5452b6a1bc347100dbb79
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Versions agree
        run: |
          if [ -z "$TAG" ]; then
            # Run by hand: release build.yaml's version, from main only, once.
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::run it on main"; exit 1; }
            v=$(sed -n 's/^version: "\(.*\)\.0"$/\1/p' build.yaml)
            TAG="v$v"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::$TAG is already released"; exit 1
            fi
            echo "TAG=$TAG" >> "$GITHUB_ENV"
          fi
          v="${TAG#v}"
          grep -q "^version: \"$v.0\"" build.yaml || { echo "::error::build.yaml's version isn't $v.0"; exit 1; }
          grep -q "<Version>$v</Version>" src/Jellyfin.Plugin.ShotChapters/Jellyfin.Plugin.ShotChapters.csproj \
            || { echo "::error::the csproj's Version isn't $v"; exit 1; }
          echo "VERSION=$v.0" >> "$GITHUB_ENV"
      - name: FFmpeg 8.1
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o ffmpeg.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_RELEASE/$FFMPEG_NAME.tar.xz"
          echo "$FFMPEG_SHA256  ffmpeg.tar.xz" | sha256sum -c -
          tar xf ffmpeg.tar.xz
          mkdir -p ~/ffmpeg && mv "$FFMPEG_NAME"/bin/ffmpeg "$FFMPEG_NAME"/bin/ffprobe ~/ffmpeg/
          echo "SHOTCHAPTERS_FFMPEG=$HOME/ffmpeg" >> "$GITHUB_ENV"
      - name: Test
        run: dotnet test --solution Jellyfin.Plugin.ShotChapters.slnx -c Release
      - name: Package
        run: |
          dotnet publish src/Jellyfin.Plugin.ShotChapters -c Release -o artifacts/publish
          zip="shot-chapters_$VERSION.zip"
          python3 tools/package.py artifacts/publish "artifacts/$zip"
          # The versions released before this one, from the latest release's manifest (none for the first).
          gh release download --repo "$GITHUB_REPOSITORY" --pattern manifest.json --dir artifacts/previous 2>/dev/null || true
          python3 tools/manifest.py "artifacts/$zip" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$zip" \
            artifacts/previous/manifest.json artifacts/manifest.json
          echo "ZIP=artifacts/$zip" >> "$GITHUB_ENV"
      - name: Release
        run: |
          python3 - > artifacts/notes.md <<'PY'
          import sys
          sys.path.insert(0, "tools")
          from package import read_build_yaml
          b = read_build_yaml(__import__("pathlib").Path("build.yaml"))
          print(b["changelog"])
          print()
          print("Install: Dashboard -> Plugins -> Repositories -> add")
          print("`https://github.com/bisforboman/jellyfin-plugin-shotchapters/releases/latest/download/manifest.json`,")
          print("then Catalog -> Shot Chapters. Needs Jellyfin " + b["targetAbi"].rsplit(".", 2)[0] + " or newer.")
          PY
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Shot Chapters $TAG" --notes-file artifacts/notes.md \
            --latest "$ZIP" artifacts/manifest.json
