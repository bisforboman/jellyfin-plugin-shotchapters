version: "0.2.1.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Chapters from shot cuts for videos without chapters of their own"
description: >
  Adds chapters at shot cuts, found with ShotDetector (a C# port of PySceneDetect), to videos that have no chapters
  or only Jellyfin's evenly spaced ones, so chapter images and chapter skipping work on rips and home videos.
  A file's own chapters are never replaced. Also marks black stretches (fades to black, black gaps) as media
  segments. Runs as the scheduled task "Generate chapters from shots", through Jellyfin's own ffmpeg.
category: "Metadata"
owner: "bisforboman"
artifacts:
- "Jellyfin.Plugin.ShotChapters.dll"
- "ShotDetector.dll"
- "FrameReader.dll"
- "FFmpeg.AutoGen.dll"
changelog: >
  Fixes chapters lost for videos the task reached while Jellyfin's library scan was still reading them: such a
  video now waits for a later run. Every file is scanned once more after the update, which also repairs files
  0.2.0 left without chapters.
